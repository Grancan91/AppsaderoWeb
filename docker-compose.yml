services:
  mysql:
    image: mysql:8.0
    container_name: appsadero-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-appsadero}
      MYSQL_USER: ${DB_USER:-appsadero}
      MYSQL_PASSWORD: ${DB_PASSWORD:-appsadero}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-appsadero}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appsadero-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appsadero-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-appsadero}
      DB_USER: ${DB_USER:-appsadero}
      DB_PASSWORD: ${DB_PASSWORD:-appsadero}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - appsadero-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appsadero-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- -p 5173 -H 0.0.0.0
    networks:
      - appsadero-net

volumes:
  mysql_data:
    driver: local

networks:
  appsadero-net:
    driver: bridge
